[sudachi]
command = "/home/hmanabe/scripts/sudachi"
args = ["-a", "-m", "B", "-s", "full"]

[decoder]
python = "python"
script = "../../../yomi-decoder/scripts/decode.py"
config = "../../../yomi-decoder/config/default.toml"
beam = 150
nbest = 5

[strategy]
default = "ngram_grouping_preferred_v1"

[post_hybrid_repairs]
rules = "post_hybrid_repairs.tsv"

[corpus_frequency]
source_corpus = "/panfs/panmt22/users/hmanabe/yomi-decoder/data/raw/core_SUW_yomi_final.txt"
source_corpus_version = "core_SUW_yomi_final"
stats_artifact = "../../data/generated/yomi_surface_reading_stats.tsv"
manifest = "../../data/generated/yomi_surface_reading_stats.manifest.json"
surface_filter = "target"

[corpus_frequency.safety]
min_count = 5
min_share = 0.95
