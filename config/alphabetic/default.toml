strict_case_max_length = 3

[deterministic]
# Keep this deliberately narrow: arbitrary number-letter combinations may be
# product names or identifiers and still require scope judgment.
measurement_units = ["mm", "cm", "m", "km", "mg", "g", "kg", "ml", "l"]

[lists]
whitelist = "config/alphabetic/whitelist.txt"
blacklist = "config/alphabetic/blacklist.txt"
case_sensitive_whitelist = "config/alphabetic/case_sensitive_whitelist.txt"
case_sensitive_blacklist = "config/alphabetic/case_sensitive_blacklist.txt"
