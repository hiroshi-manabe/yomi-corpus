<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yomi-corpus レビュー</title>
    <link rel="stylesheet" href="./style.css?v=096ccb23b7e6" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">yomi-corpus</p>
          <h1>レビュー画面</h1>
          <p class="subtitle">
            作業中の文書をレビューしたり、確定済みコーパスを閲覧したりできます。
          </p>
        </div>
        <div class="topbar-actions">
          <label class="reviewer-field">
            <span>作業者</span>
            <input id="reviewer-name" type="text" placeholder="名前（任意）" />
          </label>
        </div>
      </header>

      <div id="status-banner" class="status-banner hidden"></div>
      <div id="server-update-banner" class="server-update-banner hidden">
        <span id="server-update-message">サーバー側の状態が更新されました。</span>
        <button id="server-update-refresh" type="button">画面を更新</button>
      </div>
      <div id="runtime-status-line" class="runtime-status-line hidden"></div>

      <div class="layout">
        <main class="main">
          <section id="task-picker-panel" class="panel controls-panel">
            <div class="panel-heading">
              <h2>レビュー対象を選択</h2>
              <div id="task-picker-global-actions" class="button-row">
                <button id="select-all-docs" class="secondary-button" type="button">すべて選択</button>
                <button id="clear-doc-selection" class="secondary-button" type="button">選択解除</button>
                <button id="start-task" type="button">レビューを開始</button>
              </div>
            </div>
            <div id="task-summary" class="task-summary muted"></div>
            <div id="task-draft-list" class="task-draft-list"></div>
            <div id="task-doc-list" class="task-doc-list"></div>
          </section>

          <section class="panel controls-panel task-work-panel">
            <div class="panel-heading">
              <h2>レビュー作業</h2>
              <div class="button-row">
                <button id="back-to-task-picker" class="secondary-button" type="button">作業を保留</button>
                <button id="complete-task" class="secondary-button" type="button">作業を完了</button>
                <button id="reset-draft" class="secondary-button danger-button" type="button">作業を破棄</button>
              </div>
            </div>
          </section>

          <section class="panel export-panel task-work-panel">
            <div class="panel-heading">
              <h2>レビュー結果を提出</h2>
              <div class="button-row">
                <button id="open-issue-title" type="button">JSONをコピーしてIssueを開く</button>
                <button id="copy-json" class="secondary-button" type="button">JSONのみコピー</button>
                <button id="download-json" class="secondary-button" type="button">JSONをダウンロード</button>
              </div>
            </div>
            <div id="issue-url-summary" class="issue-url-summary muted"></div>
            <textarea id="submission-preview" spellcheck="false" readonly></textarea>
          </section>

          <section class="panel items-panel task-work-panel">
            <div class="panel-heading">
              <h2>レビュー項目</h2>
              <span id="items-summary" class="muted"></span>
            </div>
            <div id="items-container" class="items-container"></div>
          </section>

          <section class="review-submit-footer task-work-panel">
            <button id="open-issue-bottom" type="button">JSONをコピーしてIssueを開く</button>
          </section>
        </main>
      </div>
    </div>

    <div id="repeat-cancellation-bar" class="repeat-cancellation-bar hidden" role="status" aria-live="polite">
      <span id="repeat-cancellation-message"></span>
      <div class="repeat-cancellation-actions">
        <button id="repeat-cancellation-apply" type="button">残りにも適用</button>
        <button id="repeat-cancellation-undo" class="secondary-button" type="button">取り消す</button>
        <button id="repeat-cancellation-dismiss" class="secondary-button repeat-cancellation-dismiss" type="button" aria-label="閉じる">×</button>
      </div>
    </div>

    <div id="workflow-preview-modal" class="workflow-preview-modal hidden" role="dialog" aria-modal="true" aria-labelledby="workflow-preview-title">
      <div class="workflow-preview-backdrop" data-preview-close></div>
      <section class="workflow-preview-panel">
        <header class="workflow-preview-header">
          <div>
            <p class="eyebrow">文書プレビュー</p>
            <h2 id="workflow-preview-title">文書</h2>
            <div id="workflow-preview-meta" class="muted"></div>
          </div>
          <button id="workflow-preview-close" class="secondary-button" type="button">閉じる</button>
        </header>
        <div id="workflow-preview-body" class="workflow-preview-body"></div>
        <footer id="workflow-preview-actions" class="workflow-preview-actions"></footer>
      </section>
    </div>

    <div id="issue-return-modal" class="issue-return-modal hidden" role="dialog" aria-modal="true" aria-labelledby="issue-return-title">
      <div class="issue-return-backdrop"></div>
      <section class="issue-return-panel">
        <h2 id="issue-return-title">GitHub Issueを作成しましたか？</h2>
        <p id="issue-return-description" class="muted">
          コピーしたJSONを貼り付けてIssueを作成した場合は、提出済みにしてください。
          まだの場合はローカル作業を続けられます。
        </p>
        <div class="button-row">
          <button id="mark-submitted" type="button">提出済みにする</button>
          <button id="issue-not-yet" class="secondary-button" type="button">まだ提出していない</button>
        </div>
      </section>
    </div>

    <template id="item-template">
      <article class="item-card">
        <header class="item-header">
          <div>
            <div class="item-title-row">
              <span class="item-seq"></span>
              <h3 class="item-title"></h3>
            </div>
            <div class="item-badges">
              <span class="badge proposed-badge"></span>
              <span class="badge override-badge hidden"></span>
            </div>
          </div>
        </header>

        <dl class="item-meta"></dl>

        <section class="item-section">
          <h4>例</h4>
          <ul class="example-list"></ul>
        </section>

        <section class="item-section">
          <h4>注記</h4>
          <ul class="note-list"></ul>
        </section>

        <section class="item-section editable-only">
          <h4>判定を変更</h4>
          <div class="button-row">
            <button class="secondary-button accept-default" type="button">既定値を採用</button>
            <button class="secondary-button reject-item" type="button">却下</button>
            <button class="secondary-button defer-item" type="button">保留</button>
          </div>
          <label class="note-field">
            <span>注記（任意）</span>
            <textarea class="override-note" rows="2" placeholder="判定変更についての注記（任意）"></textarea>
          </label>
        </section>

        <section class="item-section readonly-only hidden">
          <h4>閲覧専用</h4>
          <p class="muted">過去のレビュー内容は参照のみ可能です。</p>
        </section>
      </article>
    </template>

    <script src="./app.js?v=26bf7ccedfd2" type="module"></script>
  </body>
</html>
